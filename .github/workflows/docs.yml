name: Deploy

# Runs after a successful Publish rather than on the release tag itself: the
# github-pages environment only accepts deployments from main, and a tag push was
# rejected by that rule on every release. A workflow_run job runs in the context of
# the default branch, so it passes, while still building the released commit.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish]
    types: [completed]

# security: restrict permissions for CI jobs.
permissions:
  contents: read

jobs:
  # Build the documentation and upload the static HTML files as an artifact.
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The commit Publish released; a manual run builds the tip of main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install @devcontainers/cli
        run: npm install --location=global @devcontainers/cli@0.73.0

      - name: Start Dev Container
        run: |
          git config --global init.defaultBranch main
          devcontainer up --workspace-folder .

      - name: Build Docs
        run: devcontainer exec --workspace-folder . poe docs

      - name: Upload Docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
        
  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
